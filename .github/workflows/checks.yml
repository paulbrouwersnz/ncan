name: Checks

# Runs on every pull request, and on main after a merge, so a page that has
# fallen out of step with partials/ or links to something missing shows up
# before it reaches the site. See tools/README.md ("Checks on pull requests").

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Pages carry the current partials
        run: |
          python tools/sync-partials.py
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            git diff --stat
            echo "::error::The pages are out of step with partials/. Run tools/sync-partials.py and commit."
            exit 1
          fi

      - name: Calendar page lists the calendars in calendars.json
        run: python tools/build-calendar-list.py --page-only --dry-run

      - name: No ?v= stamps committed (publishing adds them)
        run: |
          if grep -rlE '/assets/[^"'"'"' ]+\?v=[0-9a-f]+' --include='*.html' --exclude-dir=.git .; then
            echo "::error::These files carry ?v= stamps. Run python tools/stamp-assets.py --clear and commit."
            exit 1
          fi

      - name: Links and files within the site exist
        run: python tools/check-links.py

      - name: Planner help names buttons that exist
        run: python tools/check-planner-help.py

      - name: Facebook posts pass the home page's allowlist
        run: python tools/check-facebook-posts.py

      - name: Header photos are approved and written into the pages
        run: python tools/make-head-photo.py --check

      - name: Python tests (tests/py)
        run: python -m unittest discover -s tests/py

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      # every test in tests/js (calendar dates, header photos); the helpers must
      # not depend on the machine's time zone, so run twice
      - name: JS tests (tests/js)
        run: |
          TZ=UTC node --test "tests/js/*.test.js"
          TZ=Pacific/Auckland node --test "tests/js/*.test.js"
