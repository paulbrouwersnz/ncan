<!DOCTYPE html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- GitHub Pages shows this for any address that doesn't exist. An old page address
     (calendar.html, athlete.html?a=..., club-champs.html?season=...) is sent on to
     the page's new one by moved.js, for good; anything else gets the note below. -->
<script src="/assets/js/moved.js"></script>
<meta name="robots" content="noindex">
<title>Page not found — North Canterbury Athletic Club</title>
<link rel="icon" href="/assets/img/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/css/styles.css">
</head>
<body>
<main id="main">
  <section class="section">
    <div class="wrap">
      <div class="section-head section-head--wide">
        <p><a href="/"><img src="/assets/img/logo.svg" alt="North Canterbury Athletic Club" width="120"></a></p>
        <p class="eyebrow">Page not found</p>
        <h1>We can&rsquo;t find that page</h1>
        <p class="lede">
          It may have moved: the club&rsquo;s pages now have addresses like
          <a href="/calendar/">ncan.nz/calendar/</a>. Try the
          <a href="/">home page</a> or the <a href="/calendar/">club calendar</a>.
        </p>
      </div>
    </div>
  </section>
</main>
</body>
</html>
