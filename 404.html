<!DOCTYPE html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- GitHub Pages shows this for any address that doesn't exist. An old page address
     (calendar.html, athlete.html?a=..., club-champs.html?season=...) is sent on to
     the page's new one by moved.js, for good; anything else gets the plain note below. -->
<script src="/assets/js/moved.js"></script>
<meta name="robots" content="noindex">
<meta name="darkreader-lock">
<script>try { var t = localStorage.getItem('ncan-theme'); if (t === 'light' || t === 'dark') { document.documentElement.setAttribute('data-theme', t); } } catch (e) {}</script>
<title>Page not found — North Canterbury Athletic Club</title>
<link rel="icon" href="/assets/img/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/css/styles.css">
</head>
<body>
<main id="main">
  <section class="section">
    <div class="wrap">
      <div class="section-head section-head--wide">
        <p><a href="/"><img class="brand__logo" src="/assets/img/logo.svg" alt="North Canterbury Athletic Club" width="120"><img class="brand__logo-dark" src="/assets/img/logo-dark.svg" alt="North Canterbury Athletic Club" width="120"></a></p>
        <p class="eyebrow">404</p>
        <h1>Page not found</h1>
        <p class="lede">
          There&rsquo;s no page at this address. Check the address, or go to the
          <a href="/">home page</a>.
        </p>
      </div>
    </div>
  </section>
</main>
</body>
</html>
