<!doctype html>
<!-- A page's share image (Facebook, WhatsApp, Messenger...), 1200 x 630, drawn by
     tools/build-page-meta.py with a headless Chrome or Edge. The words and the
     photo come in the address after #, as JSON:
       {"headline": "...", "line": "...", "photo": "file:///.../cover.jpg"}
     With a photo (a gallery album) it fills the card behind the words; without
     one the card is the club's green. -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Archivo"; src: url("../assets/fonts/archivo-variable.woff2") format("woff2"); font-weight: 100 900; }
  @font-face { font-family: "Inter"; src: url("../assets/fonts/inter-variable.woff2") format("woff2"); font-weight: 100 900; }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { position: relative; background: #0B3B2E; color: #fff; font-family: "Inter", "Segoe UI", sans-serif; }
  /* the club's green, with a lighter sweep like the page headings */
  .bg { position: absolute; inset: 0;
        background: radial-gradient(120% 140% at 100% 0%, #0F4C39 0%, #0B3B2E 55%, #062A20 100%); }
  .photo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  /* over a photo: green rising from the bottom left, so the words always read */
  .shade { position: absolute; inset: 0;
           background: linear-gradient(to top, rgba(6, 42, 32, .96) 0%, rgba(6, 42, 32, .82) 38%, rgba(6, 42, 32, .15) 72%, rgba(6, 42, 32, 0) 100%),
                       linear-gradient(to bottom, rgba(6, 42, 32, .78) 0%, rgba(6, 42, 32, .35) 22%, rgba(6, 42, 32, 0) 36%); }
  .card { position: absolute; inset: 0; padding: 56px 72px 52px; display: flex; flex-direction: column; box-sizing: border-box; }
  .club { display: flex; align-items: center; gap: 20px; }
  .club img { width: 96px; height: auto; }
  .club span { font-family: "Archivo", sans-serif; font-weight: 800; font-size: 30px; line-height: 1.1; letter-spacing: -.005em; }
  .words { margin-top: auto; }
  .rule { width: 72px; height: 6px; border-radius: 3px; background: #FFC629; margin-bottom: 26px; }
  h1 { margin: 0; font-family: "Archivo", sans-serif; font-weight: 800; font-size: 84px; line-height: 1.02;
       letter-spacing: -.02em; max-width: 1056px; text-wrap: balance; }
  p { margin: 22px 0 0; font-size: 34px; line-height: 1.3; color: #D9EAE2; max-width: 1000px; text-wrap: pretty; }
  .site { position: absolute; right: 72px; top: 64px; font-family: "Archivo", sans-serif; font-weight: 700; font-size: 28px; color: #FFC629; }
  .has-photo .site { text-shadow: 0 1px 8px rgba(0, 0, 0, .45); }
  .has-photo .club span { text-shadow: 0 1px 10px rgba(0, 0, 0, .5); }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="card">
    <div class="club"><img src="../assets/img/logo-dark.svg" alt=""><span>North Canterbury<br>Athletic Club</span></div>
    <div class="site">ncan.nz</div>
    <div class="words">
      <div class="rule"></div>
      <h1 id="headline"></h1>
      <p id="line"></p>
    </div>
  </div>
<script>
  var d = {};
  try { d = JSON.parse(decodeURIComponent(location.hash.slice(1))); } catch (e) { /* the empty card */ }
  document.getElementById('headline').textContent = d.headline || '';
  document.getElementById('line').textContent = d.line || '';
  if (d.photo) {
    document.body.classList.add('has-photo');
    var img = document.createElement('img');
    img.className = 'photo';
    img.src = d.photo;
    if (d.focus) { img.style.objectPosition = d.focus; }
    var shade = document.createElement('div');
    shade.className = 'shade';
    var bg = document.querySelector('.bg');
    bg.after(img, shade);
  }
  // a long headline steps down in size until it fits on two lines
  var h = document.getElementById('headline'), size = 84;
  while (h.offsetHeight > size * 1.02 * 2 + 4 && size > 52) { size -= 4; h.style.fontSize = size + 'px'; }
</script>
</body>
</html>
